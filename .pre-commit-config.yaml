repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uzywa tagow python/name (mkdocs-material) — sama skladnia
        args: [--unsafe]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # mypy tylko na src/ — benchmarks/ nie sa pakietem (duplicate module names)
        files: ^src/
        additional_dependencies:
          - pydantic>=2.0
          - types-python-dateutil
          # Srodowisko hooka MUSI miec typowane zaleznosci glowne projektu —
          # brakujacy pakiet rozwiazuje sie jako Any i produkuje falszywe bledy
          # (aiosqlite -> ~100x no-any-return, typer -> untyped-decorator).
          # Lustro [project.dependencies] z pyproject (2026-07-27):
          - aiosqlite
          - typer>=0.9.0,<0.26
          - aiohttp>=3.9.0
          - networkx>=3.0
          - rich>=13.0.0
          - typing_extensions>=4.0
        args: [--ignore-missing-imports]
        exclude: ^tests/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        # files: ^src/ — exclude_dirs bandita NIE dziala na pliki podane jawnie
        # przez pre-commit (tylko na rekursje -r), wiec zakres tnie pre-commit
        files: ^src/
        args: [-c, pyproject.toml, -r, src/]
        additional_dependencies: ["bandit[toml]"]

  # AGENTS.md Hard Rule #2. Documented-only enforcement has failed twice: agent
  # trailers reached main's permanent history because the tooling adds them by
  # default and a reviewer has to notice a footer to catch it. This does not.
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: no AI attribution in commit messages
        entry: >-
          bash -c 'if grep -qiE "co-authored-by:.*(claude|anthropic|copilot|gpt)|generated with \[?(claude|chatgpt)|built with:.*(claude|codex|copilot)" "$1"; then
          echo "AGENTS.md Hard Rule #2: remove the AI attribution trailer from the commit message.";
          exit 1; fi' --
        language: system
        stages: [commit-msg]
